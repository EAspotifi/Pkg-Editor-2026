name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. v2026.1.0). Empty = tag or timestamp."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME}"
          else
            V="v$(date -u +%Y.%m.%d-%H%M)"
          fi
          case "$V" in v*) ;; *) V="v$V" ;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

  build-windows:
    name: Windows (.exe → .rar)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish win-x64 self-contained
        shell: bash
        run: |
          chmod +x scripts/publish-windows.sh
          ./scripts/publish-windows.sh "$GITHUB_WORKSPACE/publish-win"
          test -f publish-win/PkgEditor.exe

      - name: Stage Windows package
        shell: bash
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          STAGE="PkgEditor-Windows-${VER}"
          mkdir -p "$STAGE"
          cp publish-win/PkgEditor.exe "$STAGE/"
          # Include any companion files next to the exe (json/dll if present)
          find publish-win -maxdepth 1 -type f \( -name '*.dll' -o -name '*.json' \) -exec cp {} "$STAGE/" \; || true
          [ -f LICENSE.txt ] && cp LICENSE.txt "$STAGE/" || true
          [ -f README.md ] && cp README.md "$STAGE/" || true
          echo "Windows — Pkg Editor ${VER}" > "$STAGE/Windows.txt"
          echo "Self-contained Avalonia build (win-x64). No .NET install required." >> "$STAGE/Windows.txt"
          echo "$STAGE" > stage-name.txt

      - name: Create RAR (WinRAR)
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          $stage = "PkgEditor-Windows-$ver"
          $rarOut = "PkgEditor-Windows-$ver.rar"

          choco install winrar --yes --no-progress
          $rar = @(
            "${env:ProgramFiles}\WinRAR\Rar.exe",
            "${env:ProgramFiles(x86)}\WinRAR\Rar.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $rar) { throw "WinRAR Rar.exe not found after install" }

          & $rar a -r -ep1 -m5 $rarOut "$stage\*"
          if ($LASTEXITCODE -ne 0) { throw "Rar failed with $LASTEXITCODE" }
          Get-Item $rarOut | Format-List Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-rar
          path: PkgEditor-Windows-${{ needs.prepare.outputs.version }}.rar
          if-no-files-found: error

  build-linux:
    name: Linux (.tar + .tar.gz)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish linux-x64 portable
        run: |
          chmod +x scripts/publish-portable.sh
          ./scripts/publish-portable.sh
          test -x Portable/PkgEditor

      - name: Create .tar and .tar.gz
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          STAGE="PkgEditor-Linux-${VER}"
          mkdir -p "$STAGE"
          cp Portable/PkgEditor Portable/Launch.sh Portable/README.md "$STAGE/"
          [ -f Portable/PkgEditor.desktop ] && cp Portable/PkgEditor.desktop "$STAGE/" || true
          [ -f LICENSE.txt ] && cp LICENSE.txt "$STAGE/" || true
          [ -f README.md ] && cp README.md "$STAGE/README-repo.md" || true
          chmod +x "$STAGE/PkgEditor" "$STAGE/Launch.sh"

          tar -cf "PkgEditor-Linux-${VER}.tar" "$STAGE"
          tar -czf "PkgEditor-Linux-${VER}.tar.gz" "$STAGE"
          ls -lh "PkgEditor-Linux-${VER}.tar" "PkgEditor-Linux-${VER}.tar.gz"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarballs
          path: |
            PkgEditor-Linux-${{ needs.prepare.outputs.version }}.tar
            PkgEditor-Linux-${{ needs.prepare.outputs.version }}.tar.gz
          if-no-files-found: error

  publish-release:
    name: GitHub Release (3 assets)
    needs: [prepare, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows RAR
        uses: actions/download-artifact@v4
        with:
          name: windows-rar
          path: dist

      - name: Download Linux tarballs
        uses: actions/download-artifact@v4
        with:
          name: linux-tarballs
          path: dist

      - name: List assets
        run: ls -lah dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Pkg Editor ${{ needs.prepare.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            dist/PkgEditor-Windows-${{ needs.prepare.outputs.version }}.rar
            dist/PkgEditor-Linux-${{ needs.prepare.outputs.version }}.tar
            dist/PkgEditor-Linux-${{ needs.prepare.outputs.version }}.tar.gz
          body: |
            ## Pkg Editor ${{ needs.prepare.outputs.version }}

            ### Archivos de la release

            | Archivo | Plataforma | Formato |
            |---------| |------------|---------|
            | `PkgEditor-Windows-*.rar` | **Windows** (x64) | RAR — ejecutable `.exe` portable |
            | `PkgEditor-Linux-*.tar` | **Linux** (x64) | TAR |
            | `PkgEditor-Linux-*.tar.gz` | **Linux** (x64) | TAR.GZ |

            Ambos builds son **self-contained** (no hace falta instalar .NET).

            ### Windows
            1. Extrae el `.rar`
            2. Ejecuta `PkgEditor.exe`

            ### Linux
            ```bash
            tar -xzf PkgEditor-Linux-*.tar.gz   # o: tar -xf PkgEditor-Linux-*.tar
            cd PkgEditor-Linux-*
            ./PkgEditor
            ```

            ### Créditos
            - Línea Pkg-Editor: [KimieStar](https://github.com/KimieStar)
            - LibOrbisPkg: [maxton](https://github.com/maxton/LibOrbisPkg)
            - Port Linux / release packaging: EAspotifi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
